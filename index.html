  <h2>Del sistema a la matriz</h2>
  <p>Todo sistema lineal se escribe como <b>A·X = b</b>:</p>
  <div class="demo"><div style="font-family:var(--math);font-size:1.3rem;line-height:1.6">x + y − z = 6<br>3x − 2y + z = −5<br>x + 3y − 2z = 14</div><span class="sym">⟶</span>${mtx([['1','1','-1','6'],['3','-2','1','-5'],['1','3','-2','14']],{bar:3})}</div>
  <ul><li><b>A</b>: matriz de coeficientes. <b>X</b>: vector de incógnitas. <b>b</b>: términos independientes.</li><li><b>[A | b]</b>: matriz aumentada; la línea vertical separa coeficientes de resultados.</li><li>Si falta una variable en una ecuación, su coeficiente es <b>0</b>.</li></ul>`},
 {key:'operaciones', t:'Operaciones elementales', h:`
  <h2>Operaciones elementales por fila</h2>
  <p>No cambian la solución del sistema:</p>
  <table><tr><th>Operación</th><th>Notación</th></tr>
   <tr><td>Intercambiar dos filas</td><td><code>F1 ↔ F2</code></td></tr>
   <tr><td>Multiplicar una fila por un escalar k ≠ 0</td><td><code>F2 → (1/10)·F2</code></td></tr>
   <tr><td>Sumar a una fila un múltiplo de otra</td><td><code>F3 → F3 − 4F2</code></td></tr></table>
  <p><b>Meta:</b> llegar a una matriz escalonada (triangular superior).</p>
  <h3>Cómo elegir el multiplicador</h3>
  <div class="formula">Para anular a<sub>ij</sub>: F<sub>i</sub> → F<sub>i</sub> − <span class="red">(a<sub>ij</sub> / pivote)</span>·F<sub>pivote</sub></div>
  <p>Escribe siempre la operación al margen: evita perder signos negativos.</p>`},
 {key:'gauss', t:'Eliminación Gaussiana', h:`
  <h2>Eliminación Gaussiana</h2>
  <div class="formula">[A | b] ⟶ <span class="red">[Triangular | c]</span> ⟶ sustitución regresiva</div>
  <ol><li>Escribe la matriz aumentada.</li><li>Haz ceros <b>debajo</b> de cada pivote, columna por columna.</li><li>Con la matriz triangular, despeja la <b>última</b> variable y sustituye hacia arriba (z → y → x).</li></ol>
  <div class="demo">${mtx([['1','1','-1','6'],['0','-5','4','-23'],['0','0','3','-6']],{bar:3,cls:'tri'})}<div style="font-family:var(--math);font-size:1.2rem">3z = −6 → z = −2<br>−5y + 4(−2) = −23 → y = 3<br>x + 3 − (−2) = 6 → x = 1</div></div>
  <p><b>Ventaja:</b> proceso más corto; computacionalmente rápido para sistemas grandes.</p>`},
 {key:'gaussjordan', t:'Gauss-Jordan', h:`
  <h2>Método de Gauss-Jordan</h2>
  <p>Extensión de Gauss: no se detiene en el triángulo. Convierte cada pivote en <b>1</b> y hace ceros <b>arriba y abajo</b>.</p>
  <div class="formula">[A | b] ⟶ <span class="red">[ I | X ]</span></div>
  <div class="demo">${mtx([['1','0','0','1'],['0','1','0','3'],['0','0','1','-2']],{bar:3,cls:'ident'})}<span>Solución directa: x = 1, y = 3, z = −2</span></div>
  <ul><li>No requiere sustitución regresiva.</li><li>Útil para hallar la inversa: [A | I] → [I | A⁻¹].</li><li><b>Error frecuente:</b> detenerse con un pivote distinto de 1.</li></ul>`},
 {key:'cramer', t:'Regla de Cramer', h:`
  <h2>Regla de Cramer</h2>
  <p>Resuelve con <b>cocientes de determinantes</b>, sin modificar la matriz original.</p>
  <div class="formula">x = <span class="red">D<sub>x</sub></span>/D &nbsp;&nbsp; y = <span class="red">D<sub>y</sub></span>/D &nbsp;&nbsp; z = <span class="red">D<sub>z</sub></span>/D</div>
  <h3>Condiciones críticas</h3>
  <ol><li>Matriz <b>cuadrada</b> (n ecuaciones = n incógnitas).</li><li><b>D = det(A) ≠ 0</b>.</li></ol>
  <h3>Mecánica</h3>
  <p>D<sub>x</sub>: copia A y reemplaza la <b>columna de x</b> por el vector b. Igual para D<sub>y</sub> y D<sub>z</sub>.</p>
  <div class="demo">${mtx([['b₁','a₁₂','a₁₃'],['b₂','a₂₂','a₂₃'],['b₃','a₃₂','a₃₃']],{hlcol:[0]})}<span>= D<sub>x</sub></span></div>
  <p>Si D = 0, Cramer falla: el sistema es S.C.I. o S.I. → usa Gauss.</p>`},
 {key:'clasificacion', t:'Tipos de solución', h:`
  <h2>Clasificación de sistemas</h2>
  <table><tr><th>Tipo</th><th>Determinante</th><th>Al escalonar</th><th>Geometría (2×2)</th></tr>
   <tr><td><b>S.C.D.</b> Compatible determinado</td><td>det ≠ 0</td><td>Un pivote por variable</td><td>Rectas que se cortan en un punto → <b>solución única</b></td></tr>
   <tr><td><b>S.C.I.</b> Compatible indeterminado</td><td>det = 0</td><td>Fila <b>0 0 0 | 0</b></td><td>Rectas coincidentes → <b>infinitas soluciones</b> (variable libre t)</td></tr>
   <tr><td><b>S.I.</b> Incompatible</td><td>det = 0</td><td>Fila <b>0 0 0 | c</b>, c ≠ 0</td><td>Rectas paralelas → <b>sin solución</b></td></tr></table>
  <div class="demo">${mtx([['1','1','2'],['0','0','1']],{bar:2,hl:[1]})}<span>x + y = 2 y 2x + 2y = 5 → 0 = 1 → <b>S.I.</b></span></div>
  <p>En un contexto empresarial, un S.C.I. indica que <b>falta una condición</b> para decidir; un S.I. indica que los datos o el pedido son <b>inconsistentes</b>.</p>`},
 {key:'homogeneo', t:'Sistemas homogéneos', h:`
  <h2>Sistemas homogéneos</h2>
  <p>Son de la forma <b>A·X = 0</b> (todos los términos independientes son cero).</p>
  <div class="demo">${mtx([['a₁₁','a₁₂','0'],['a₂₁','a₂₂','0']],{bar:2,hlcol:[2]})}</div>
  <ul><li><b>Siempre</b> son compatibles: tienen al menos la solución trivial X = 0.</li><li>Si det(A) ≠ 0 → <b>solo</b> la solución trivial.</li><li>Si det(A) = 0 → <b>infinitas soluciones</b> no triviales (S.C.I.), expresadas con un parámetro t.</li></ul>
  <p>Aplicación: modelo cerrado de Leontief, <b>(I − E)·p = 0</b>, donde p da las <b>proporciones</b> de equilibrio entre sectores.</p>`},
 {key:'errores', t:'Errores frecuentes', h:`
  <h2>No confundas esto</h2>
  <div class="err"><div class="bad"><b>Error:</b> aplicar Cramer a ciegas sin revisar la base.</div><div class="good"><b>Correcto:</b> calcula det(A) primero. Si det(A) = 0, detente: el sistema es indeterminado o incompatible.</div></div>
  <div class="err"><div class="bad"><b>Error:</b> hacer multiplicaciones «mágicas» en la cabeza y perder los signos negativos.</div><div class="good"><b>Correcto:</b> anota siempre la operación (F2 − 3F1) en el margen.</div></div>
  <div class="err"><div class="bad"><b>Error:</b> detener Gauss-Jordan antes de tener puros 1 en la diagonal.</div><div class="good"><b>Correcto:</b> la identidad exige unos en la diagonal; un pivote 3 no es el final.</div></div>
  <div class="err"><div class="bad"><b>Error:</b> no verificar ni interpretar.</div><div class="good"><b>Correcto:</b> sustituye en las ecuaciones originales (A·X = b) y revisa que tenga sentido: cantidades no negativas, enteras, etc.</div></div>`},
 {key:'comparar', t:'Cuadro comparativo', h:`
  <h2>Cheat sheet de métodos</h2>
  <table><tr><th>Dimensión</th><th>Gauss</th><th>Gauss-Jordan</th><th>Cramer</th><th>Inversa</th></tr>
   <tr><td><b>Técnica base</b></td><td>Operaciones por filas</td><td>Operaciones por filas</td><td>Cociente de determinantes</td><td>X = A⁻¹·b</td></tr>
   <tr><td><b>Matriz resultante</b></td><td>Triangular superior</td><td>Identidad</td><td>Matrices con columna reemplazada</td><td>A⁻¹</td></tr>
   <tr><td><b>Velocidad</b></td><td>Alta, óptima para N grandes</td><td>Media, da la inversa</td><td>Lenta, solo n pequeño</td><td>Ideal si cambian solo los b</td></tr>
   <tr><td><b>Condición de falla</b></td><td>Fila 0 = constante</td><td>Fila 0 = constante</td><td>det(A) = 0</td><td>det(A) = 0</td></tr></table>`}
];

function openTheory(key){
  const items = THEORY.filter(t=>t.key);
  key = key || (items.find(t=>t.key===state.lastTheory)?.key) || 'modelar';
  state.lastTheory = key;
  $('#mside').innerHTML = `<div class="ttl">Teoría</div>` + THEORY.map(t=> t.grp ? `<div class="grp">${t.grp}</div>` : `<button data-k="${t.key}" class="${t.key===key?'active':''}" onclick="openTheory('${t.key}')">${t.t}</button>`).join('');
  const it = items.find(t=>t.key===key);
  $('#mmain').innerHTML = `<button class="mclose" onclick="closeTheory()" aria-label="Cerrar">×</button>` + it.h;
  $('#mmain').scrollTop = 0;
  $('#modal').classList.add('open');
  const act = $('#mside button.active'); if(act) act.scrollIntoView({block:'nearest',inline:'nearest'});
}
function closeTheory(){ $('#modal').classList.remove('open'); }

/* ================== STATE / ROUTING ================== */
const state = {lastTheory:null, all:false};
function go(h){ location.hash = h; }
function route(){
  const h = location.hash || '#/';
  const m = h.match(/^#\/caso\/(\w+)(?:\/(\w+))?(?:\/(\d+))?/);
  if(m){
    const c = CASES.find(x=>x.id===m[1]);
    if(c){ renderCase(c, m[2]||'enunciado', parseInt(m[3]||'1',10)); return; }
  }
  renderHome();
}
function navLinks(cur){
  $('#navLinks').innerHTML = `<button class="${!cur?'active':''}" onclick="go('#/')">Inicio</button>` +
    CASES.map(c=>`<button class="${cur===c.id?'active':''}" onclick="go('#/caso/${c.id}')">${String(c.num).padStart(2,'0')} · ${c.short}</button>`).join('');
}

function renderHome(){
  navLinks(null);
  document.title = 'Casos Empresariales · Sistemas Lineales';
  $('#app').innerHTML = `
  <section class="hero">
    <div class="kicker">Álgebra Superior · Unidades 1 y 2</div>
    <h1>Casos empresariales<br>con sistemas lineales</h1>
    <p>Ocho situaciones reales de negocio resueltas paso a paso con matrices, determinantes, Gauss, Gauss-Jordan, Cramer e inversa. Cada solución está <b>verificada</b> con A·X = b.</p>
    <div class="chips"><span class="chip">8 casos</span><span class="chip">${CASES.reduce((a,c)=>a+c.steps.length,0)} pasos</span><span class="chip">S.C.D. · S.C.I. · S.I.</span><span class="chip">Sistemas homogéneos</span></div>
    <button class="btn-play" onclick="go('#/caso/${CASES[0].id}')">▶ Empezar caso 1</button>
    <button class="btn-ghost" onclick="openTheory()">ⓘ Repasar teoría</button>
  </section>
  <h2 class="row-title">Todos los casos <small>Elige uno para ver el enunciado y su recorrido de solución</small></h2>
  <div class="cards">${CASES.map(c=>`
    <button class="card" style="--c:${c.color}" onclick="go('#/caso/${c.id}')">
      <div class="bg"></div><div class="num">${String(c.num).padStart(2,'0')}</div>
      <span class="badge">${c.metodo}</span>
      <h3>${c.title}</h3>
      <p class="emp">${c.empresa}</p>
      <div class="meta"><span>${c.unidad}</span><span>${c.steps.length} pasos</span></div>
    </button>`).join('')}</div>
  <h2 class="row-title">¿Qué método usa cada caso?</h2>
  <div class="methods">
    <div class="mcard"><div class="big">Gauss</div><h4>Casos 1, 5, 6, 7</h4><p>Triangular superior y sustitución regresiva. Detecta S.C.I. y S.I.</p></div>
    <div class="mcard"><div class="big">Gauss-Jordan</div><h4>Casos 2 y 8</h4><p>Hasta la forma escalonada reducida: identidad en el caso 2; variable libre en el caso 8.</p></div>
    <div class="mcard"><div class="big">Cramer</div><h4>Caso 3</h4><p>Cocientes de determinantes (Sarrus) con D ≠ 0.</p></div>
    <div class="mcard"><div class="big">Inversa</div><h4>Caso 4</h4><p>Cofactores, adjunta y X = A⁻¹·B para varios escenarios.</p></div>
  </div>`;
  window.scrollTo(0,0);
}

function renderCase(c, view, n){
  navLinks(c.id);
  document.title = `Caso ${c.num} · ${c.title}`;
  const idx = CASES.indexOf(c);
  const prev = CASES[idx-1], next = CASES[idx+1];
  const total = c.steps.length;
  n = Math.min(Math.max(n,1), total);
  const head = `
  <section class="case-head">
    <div class="case-num">${String(c.num).padStart(2,'0')}</div>
    <div>
      <div class="kicker">${c.empresa} · ${c.sector}</div>
      <h1>${c.title}</h1>
      <div class="chips"><span class="chip red">${c.metodo}</span><span class="chip">${c.unidad}</span><span class="chip">${total} pasos</span></div>
    </div>
  </section>
  <div class="tabs" role="tablist">
    <button class="${view==='enunciado'?'active':''}" onclick="go('#/caso/${c.id}/enunciado')">📄 Enunciado</button>
    <button class="${view==='solucion'?'active':''}" onclick="go('#/caso/${c.id}/solucion/${view==='solucion'?n:1}')">🧮 Solución paso a paso</button>
  </div>`;
  let body = '';
  if(view==='enunciado'){
    body = `<div class="statement">
      <div class="txt">${c.enunciado.map(p=>`<p>${p}</p>`).join('')}${c.tabla?dataTable(c.tabla):''}</div>
      <div><div class="question"><div class="kicker">La pregunta del caso</div><p>${c.pregunta}</p>
        <button class="btn-play" onclick="go('#/caso/${c.id}/solucion/1')">▶ Ver solución</button></div>
        <p class="kbd-hint" style="text-align:left;margin-top:16px">Intenta resolverlo primero en papel. Usa el botón <b>Teoría</b> si necesitas recordar un método.</p></div>
    </div>`;
  } else {
    const stepHTML = (s,i)=>`
      <article class="step">
        <span class="tag">${s.tag}</span>
        <h2><span class="n">${i+1}.</span>${s.title}</h2>
        ${s.html?`<p class="lead">${s.html}</p>`:''}
        <div class="blocks">${s.blocks.map(renderBlock).join('')}</div>
        ${s.theory?`<button class="theory-link" onclick="openTheory('${s.theory}')">📘 Recordar: ${THEORY.find(t=>t.key===s.theory)?.t||'Teoría'}</button>`:''}
      </article>`;
    const compact = `<details style="margin-top:22px"><summary style="cursor:pointer;font-weight:700;color:var(--muted)">Ver enunciado</summary><div style="padding-top:10px">${c.enunciado.map(p=>`<p style="font-size:1.1rem">${p}</p>`).join('')}${c.tabla?dataTable(c.tabla):''}<p style="font-size:1.2rem"><b>${c.pregunta}</b></p></div></details>`;
    if(state.all){
      body = compact + `<div class="step-meta" style="margin-top:20px"><div class="step-count">Recorrido completo · ${total} pasos</div><button class="toggle-all" onclick="state.all=false;route()">Ver paso a paso</button></div>` + c.steps.map(stepHTML).join('');
    } else {
      body = compact + `
      <div class="progress">${c.steps.map((s,i)=>`<button title="Paso ${i+1}: ${s.title.replace(/<[^>]+>/g,'')}" class="${i+1<n?'done':''} ${i+1===n?'cur':''}" onclick="go('#/caso/${c.id}/solucion/${i+1}')"></button>`).join('')}</div>
      <div class="step-meta"><div class="step-count">Paso <b>${n}</b> / ${total}</div><button class="toggle-all" onclick="state.all=true;route()">Ver todos los pasos</button></div>
      ${stepHTML(c.steps[n-1], n-1)}
      <div class="step-nav">
        <button class="btn light" ${n===1?'disabled':''} onclick="go('#/caso/${c.id}/solucion/${n-1}')">◀ Anterior</button>
        ${n<total?`<button class="btn primary" onclick="go('#/caso/${c.id}/solucion/${n+1}')">Siguiente paso ▶</button>`
          : (next?`<button class="btn dark" onclick="go('#/caso/${next.id}')">Siguiente caso: ${next.title} ▶</button>`:`<button class="btn dark" onclick="go('#/')">Volver al inicio ▶</button>`)}
      </div>
      <div class="kbd-hint">Atajos: <span class="kbd">←</span> <span class="kbd">→</span> para moverte entre pasos · <span class="kbd">T</span> teoría · <span class="kbd">Esc</span> cerrar</div>`;
    }
  }
  const foot = `<div class="case-foot">
    ${prev?`<button onclick="go('#/caso/${prev.id}')"><small>◀ Caso anterior</small><strong>${String(prev.num).padStart(2,'0')} · ${prev.title}</strong></button>`:`<button onclick="go('#/')"><small>◀ Volver</small><strong>Inicio</strong></button>`}
    ${next?`<button class="next" onclick="go('#/caso/${next.id}')"><small>Caso siguiente ▶</small><strong>${String(next.num).padStart(2,'0')} · ${next.title}</strong></button>`:`<button class="next" onclick="go('#/')"><small>Fin ▶</small><strong>Inicio</strong></button>`}
  </div>`;
  const keepScroll = state.keep; state.keep=false;
  $('#app').innerHTML = head + body + foot;
  if(view==='solucion' && !state.all){
    const p = document.querySelector('.progress');
    if(p && window.__lastCase===c.id && window.__lastView==='solucion') p.scrollIntoView({block:'start'}); else window.scrollTo(0,0);
    window.scrollBy(0,-90);
  } else window.scrollTo(0,0);
  window.__lastCase=c.id; window.__lastView=view;
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeTheory(); return; }
  if($('#modal').classList.contains('open')) return;
  if(e.target.matches('input,textarea')) return;
  if(e.key==='t'||e.key==='T'){ openTheory(); return; }
  const m = (location.hash||'').match(/^#\/caso\/(\w+)\/solucion\/(\d+)/);
  if(m && !state.all){
    const c = CASES.find(x=>x.id===m[1]); const n = +m[2];
    if(e.key==='ArrowRight' && n<c.steps.length) go(`#/caso/${c.id}/solucion/${n+1}`);
    if(e.key==='ArrowLeft' && n>1) go(`#/caso/${c.id}/solucion/${n-1}`);
  }
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
